[project]
name = "discord-bot"
version = "0.1.0"
description = "Discord бот для автоматизированного администрирования Discord сервера онлайн игры"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.20.0",
    "chardet==5.2.0",
    "loguru==0.7.2",
    "py-cord==2.6.1",
    "pydantic-settings==2.7.1",
    "requests==2.31.0",
    "sqlalchemy[asyncio]==2.0.37",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false
